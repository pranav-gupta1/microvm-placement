# KEDA scales the vmhost Deployment to match a single number the placement API
# computes and exports.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vmhost
  namespace: microvm
spec:
  scaleTargetRef:
    name: vmhost

  # The floor is non-zero on purpose, and higher than a single pod.
  #
  # Scaling to zero would mean the first request of a cycle waits for a pod to
  # start. Beyond that, a cold fleet cannot track the first 60 second ramp to
  # 1000 rps: starting from 8 pods produced client-side timeouts while KEDA
  # caught up, and starting from 12 did not. This is the same headroom argument
  # CapacityBuffer makes at the node level, applied to pods.
  minReplicaCount: 12
  # Bounded by what one kind node will admit. kubelet caps a node at 110 pods
  # and the system namespaces already hold about twenty, so a higher ceiling
  # would leave pods Pending and manufacture the drops this run disproves.
  # On real metal this would be the 120 the capacity plan derives.
  maxReplicaCount: 32

  # KEDA's own poll interval.
  pollingInterval: 5
  # Long enough that the trough does not trigger a teardown that cannot be
  # rebuilt in time for the second climb.
  cooldownPeriod: 60

  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          # React immediately.
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 20
              periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            # Shed at most a quarter of the fleet per minute.
            - type: Percent
              value: 25
              periodSeconds: 60
          selectPolicy: Min

  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.observability.svc.cluster.local:9090
        metricName: microvm_desired_vmhost_replicas
        # max() over the series collapses multiple placement-api replicas to a
        # single answer.
        query: max(microvm_desired_vmhost_replicas)
        threshold: "1"
