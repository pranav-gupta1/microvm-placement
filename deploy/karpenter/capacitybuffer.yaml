# Pre-provisioned spare capacity, via Karpenter's CapacityBuffer API.
---
apiVersion: autoscaling.x-k8s.io/v1beta1
kind: CapacityBuffer
metadata:
  name: vmhost-ramp
  namespace: microvm
spec:
  # Percentage buffers only work against an object exposing a scale
  # subresource, which a Deployment does.
  scalableRef:
    apiGroup: apps
    kind: Deployment
    name: vmhost
  # 20% headroom.
  percentage: 20
  provisioningStrategy: active-capacity
---
apiVersion: autoscaling.x-k8s.io/v1beta1
kind: CapacityBuffer
metadata:
  name: vmhost-floor
  namespace: microvm
spec:
  # A flat floor of warm capacity for the cold start, expressed as a pod shape
  # rather than a percentage of a Deployment that is currently tiny.
  podTemplateRef:
    name: vmhost-buffer-template
  replicas: 4
  provisioningStrategy: active-capacity
---
# The shape the floor buffer reserves.
apiVersion: v1
kind: PodTemplate
metadata:
  name: vmhost-buffer-template
  namespace: microvm
template:
  metadata:
    labels:
      app: vmhost
      microvm.io/buffer: "true"
  spec:
    nodeSelector:
      microvm.io/role: vmhost
    containers:
      - name: vmhostd
        image: microvm/vmhostd:dev
        resources:
          requests:
            cpu: "8"
            # 8 GiB of accounted guest memory plus supervisor overhead.
            memory: 10Gi
          limits:
            memory: 10Gi
